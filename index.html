<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trainer BLE Test</title>
<style>
/* Layout: single column tool — status, live numbers, ERG control, log */
:root{--bg:#f3f5f7;--panel:#fff;--fg:#14202b;--muted:#5b6b78;--line:#d9e0e6;--accent:#0a6cff;--ok:#11875a;--bad:#c62828;
--sans:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1419;--panel:#162029;--fg:#e6edf3;--muted:#8fa1b0;--line:#26333f;--accent:#4d94ff;--ok:#3cc98a;--bad:#ff6b6b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1419;--panel:#162029;--fg:#e6edf3;--muted:#8fa1b0;--line:#26333f;--accent:#4d94ff;--ok:#3cc98a;--bad:#ff6b6b;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-size:22px;margin:0}
p{margin:0;color:var(--muted);line-height:1.5}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
button{font:inherit;font-weight:600;padding:12px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.status{font-weight:600}.status.ok{color:var(--ok)}.status.bad{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.metric{border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center}
.metric b{display:block;font-family:var(--mono);font-size:28px;font-variant-numeric:tabular-nums}
.metric span{font-size:12px;color:var(--muted);letter-spacing:.04em}
input{font:inherit;font-family:var(--mono);width:90px;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
#log{font-family:var(--mono);font-size:12px;white-space:pre-wrap;word-break:break-all;max-height:240px;overflow:auto;margin:0;color:var(--muted)}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;600&display=swap">
</head>
<body>
<main>
  <h1>Smart Trainer Connection Test</h1>
  <p>Open in Chrome on Android. Power on the trainer, turn on Bluetooth and Location on your phone, and close any training app that may be holding the trainer&rsquo;s Bluetooth connection.</p>

  <section>
    <div class="status" id="status">Not connected</div>
    <div class="row">
      <button id="connect">Connect trainer</button>
      <button id="disconnect" class="ghost" disabled>Disconnect</button>
    </div>
  </section>

  <section>
    <div class="grid">
      <div class="metric"><b id="power">--</b><span>Power W</span></div>
      <div class="metric"><b id="cadence">--</b><span>Cadence rpm</span></div>
      <div class="metric"><b id="speed">--</b><span>Speed km/h</span></div>
    </div>
  </section>

  <section>
    <strong>ERG mode (FTMS target power)</strong>
    <div class="row">
      <input id="target" type="number" value="150" min="0" max="2000" step="10" inputmode="numeric">
      <span>W</span>
      <button id="erg" disabled>Set power</button>
      <button id="ergoff" class="ghost" disabled>Stop control</button>
    </div>
  </section>

  <section>
    <strong>Log</strong>
    <pre id="log"></pre>
  </section>
</main>

<script>
const FTMS=0x1826, CPS=0x1818, FEC='6e40fec1-b5a3-f393-e0a9-e50e24dcca9e';
const $=id=>document.getElementById(id);
let device=null, cp=null;

function log(m){const t=new Date().toLocaleTimeString();$('log').textContent=`[${t}] ${m}\n`+$('log').textContent;}
function setStatus(t,c){const s=$('status');s.textContent=t;s.className='status '+(c||'');}

(async()=>{
  if(!navigator.bluetooth){setStatus('This browser does not support Web Bluetooth (or it is blocked by the page frame)','bad');log('navigator.bluetooth is missing. Use Chrome on Android.');$('connect').disabled=true;return;}
  try{const a=await navigator.bluetooth.getAvailability();log('Bluetooth adapter available: '+a);}catch(e){log('getAvailability failed: '+e.message);}
})();

$('connect').onclick=async()=>{
  try{
    setStatus('Searching…');
    device=await navigator.bluetooth.requestDevice({
      filters:[{services:[FTMS]},{services:[CPS]},{services:[FEC]}],
      optionalServices:[FTMS,CPS,FEC,'device_information','battery_service']
    });
    log('Selected device: '+(device.name||device.id));
    device.addEventListener('gattserverdisconnected',()=>{setStatus('Disconnected','bad');log('Device disconnected');ui(false);});
    const server=await device.gatt.connect();
    setStatus('Connected: '+(device.name||'device'),'ok'); ui(true);
    const svcs=await server.getPrimaryServices();
    log('Services: '+svcs.map(s=>s.uuid.slice(4,8)).join(', '));
    let gotFtms=false;
    try{
      const f=await server.getPrimaryService(FTMS);
      const bike=await f.getCharacteristic(0x2AD2);
      bike.addEventListener('characteristicvaluechanged',e=>parseBike(e.target.value));
      await bike.startNotifications(); gotFtms=true; log('Subscribed to FTMS Indoor Bike Data');
      try{
        cp=await f.getCharacteristic(0x2AD9);
        cp.addEventListener('characteristicvaluechanged',e=>{const v=e.target.value;log('Control point response: '+hex(v));});
        await cp.startNotifications();
        $('erg').disabled=$('ergoff').disabled=false; log('FTMS control point ready');
      }catch(e){log('Control point unavailable: '+e.message);}
    }catch(e){log('No FTMS: '+e.message);}
    if(!gotFtms){
      try{
        const c=await (await server.getPrimaryService(CPS)).getCharacteristic(0x2A63);
        c.addEventListener('characteristicvaluechanged',e=>{$('power').textContent=e.target.value.getInt16(2,true);});
        await c.startNotifications(); log('Subscribed to Cycling Power');
      }catch(e){log('No Cycling Power: '+e.message);}
    }
  }catch(e){
    if(e.name==='SecurityError'||/permission|policy|allowed/i.test(e.message)){
      setStatus('Bluetooth blocked by the browser or page frame','bad');
      log(e.name+': '+e.message+'\nThis page may be embedded in a restricted frame that cannot use Bluetooth.');
    }else if(e.name==='NotFoundError'){setStatus('No device selected','bad');log(e.message);}
    else{setStatus('Connection failed','bad');log(e.name+': '+e.message);}
  }
};

$('disconnect').onclick=()=>{device?.gatt?.disconnect();};

function ui(on){$('disconnect').disabled=!on;$('connect').disabled=on;if(!on){$('erg').disabled=$('ergoff').disabled=true;cp=null;}}
function hex(v){return [...new Uint8Array(v.buffer)].map(b=>b.toString(16).padStart(2,'0')).join(' ');}

// FTMS Indoor Bike Data (0x2AD2)
function parseBike(v){
  const fl=v.getUint16(0,true); let o=2;
  if(!(fl&1)){$('speed').textContent=(v.getUint16(o,true)/100).toFixed(1);o+=2;}
  if(fl&2)o+=2;
  if(fl&4){$('cadence').textContent=Math.round(v.getUint16(o,true)/2);o+=2;}
  if(fl&8)o+=2;
  if(fl&16)o+=3;
  if(fl&32)o+=2;
  if(fl&64){$('power').textContent=v.getInt16(o,true);o+=2;}
}

async function write(bytes){await cp.writeValueWithResponse(new Uint8Array(bytes));log('Wrote: '+bytes.map(b=>b.toString(16).padStart(2,'0')).join(' '));}
$('erg').onclick=async()=>{
  try{
    const w=Math.max(0,Math.min(2000,parseInt($('target').value)||0));
    await write([0x00]);           // Request Control
    await write([0x07]);           // Start/Resume
    await write([0x05,w&255,(w>>8)&255]); // Set Target Power
  }catch(e){log('ERG failed: '+e.message);}
};
$('ergoff').onclick=async()=>{try{await write([0x08,0x01]);await write([0x01]);}catch(e){log('Stop failed: '+e.message);}};
</script>
</body>
</html>
